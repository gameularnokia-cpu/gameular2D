<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #menu {
            text-align: center;
            z-index: 10;
        }
        #game {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #hp-controls {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #hp-controls button {
            width: 50px;
            height: 50px;
            margin: 5px;
        }
        .control-row {
            display: flex;
            justify-content: center;
        }
        #canvas-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        canvas {
            border: 2px solid white;
            background: radial-gradient(circle, #1a1a2e, #16213e, #0f3460, #000);
            /* Simulasi galaksi dengan gradien */
        }
        #pc-controls {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #pc-controls button {
            width: 50px;
            height: 50px;
            margin: 5px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
        }
        #reset-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Snake Game</h1>
        <p>Pilih Tingkatan:</p>
        <button onclick="startGame(1)">Mudah</button>
        <button onclick="startGame(2)">Normal</button>
        <button onclick="startGame(3)">Susah</button>
    </div>
    <div id="game">
        <div id="hp-controls">
            <h3>HP Kontrol</h3>
            <div class="control-row">
                <button id="up-hp">↑</button>
            </div>
            <div class="control-row">
                <button id="left-hp">←</button>
                <button id="down-hp">↓</button>
                <button id="right-hp">→</button>
            </div>
        </div>
        <div id="canvas-container">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
        <div id="pc-controls">
            <h3>PC Kontrol</h3>
            <div class="control-row">
                <button id="up-pc">↑</button>
            </div>
            <div class="control-row">
                <button id="left-pc">←</button>
                <button id="down-pc">↓</button>
                <button id="right-pc">→</button>
            </div>
        </div>
        <p id="score">Skor: 0</p>
        <button id="reset-btn" onclick="resetGame()">Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');

        let snake = [{x: 400, y: 300}];
        let direction = {x: 0, y: 0};
        let food = []; // Array untuk 3 apel
        let obstacles = [];
        let score = 0;
        let gameRunning = false;
        let speed = 125; // Kecepatan normal 125ms
        let gameLoop;
        let level;

        // Audio
        const eatSound = new Audio('');
        const bgMusic = new Audio('');
        bgMusic.loop = true;

        function startGame(selectedLevel) {
            level = selectedLevel;
            menu.style.display = 'none';
            game.style.display = 'block';
            resetGame();
            gameRunning = true;
            bgMusic.play(); // Mulai musik latar
            gameLoop = setInterval(update, speed);
        }

        function resetGame() {
            snake = [{x: 400, y: 300}];
            direction = {x: 0, y: 0};
            score = 0;
            scoreElement.textContent = 'Skor: ' + score;
            setObstacles();
            spawnFood();
            gameRunning = false;
            clearInterval(gameLoop);
            bgMusic.pause();
            bgMusic.currentTime = 0;
            // Restart game loop setelah reset
            gameRunning = true;
            gameLoop = setInterval(update, speed);
        }

        function setObstacles() {
            obstacles = [];
            let numObstacles;
            switch (level) {
                case 1: numObstacles = 0; break; // Mudah: 0 rintangan
                case 2: numObstacles = 5; break; // Normal: 5 rintangan
                case 3: numObstacles = 10; break; // Sulit: 10 rintangan
            }
            for (let i = 0; i < numObstacles; i++) {
                let obs;
                do {
                    obs = {
                        x: Math.floor(Math.random() * 40) * 20,
                        y: Math.floor(Math.random() * 30) * 20
                    };
                } while (isOccupied(obs.x, obs.y));
                obstacles.push(obs);
            }
        }

        function spawnFood() {
            food = []; // Reset food array
            for (let i = 0; i < 3; i++) { // Spawn 3 apel
                let f;
                do {
                    f = {
                        x: Math.floor(Math.random() * 40) * 20,
                        y: Math.floor(Math.random() * 30) * 20
                    };
                } while (isOccupied(f.x, f.y));
                food.push(f);
            }
        }

        function isOccupied(x, y) {
            // Cek apakah posisi ditempati oleh ular atau rintangan
            for (let segment of snake) {
                if (segment.x === x && segment.y === y) return true;
            }
            for (let obs of obstacles) {
                if (obs.x === x && obs.y === y) return true;
            }
            for (let f of food) {
                if (f.x === x && f.y === y) return true;
            }
            return false;
        }

        function update() {
            if (!gameRunning) return;

            // Update snake position
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            // Wrap around canvas
            if (head.x < 0) head.x = 780;
            else if (head.x >= 800) head.x = 0;
            if (head.y < 0) head.y = 580;
            else if (head.y >= 600) head.y = 0;

            snake.unshift(head);

            // Check obstacle collision
            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) {
                    gameOver();
                    return;
                }
            }

            // Check food collision
            let ateFood = false;
            for (let i = 0; i < food.length; i++) {
                if (head.x === food[i].x && head.y === food[i].y) {
                    score++;
                    scoreElement.textContent = 'Skor: ' + score;
                    eatSound.play(); // Suara makan
                    food.splice(i, 1); // Hapus apel yang dimakan
                    ateFood = true;
                    break;
                }
            }
            if (ateFood) {
                // Spawn apel baru untuk mengganti yang dimakan, tetap 3
                let f;
                do {
                    f = {
                        x: Math.floor(Math.random() * 40) * 20,
                        y: Math.floor(Math.random() * 30) * 20
                    };
                } while (isOccupied(f.x, f.y));
                food.push(f);
            } else {
                snake.pop();
            }

            // Check self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            // Draw obstacles (bulat berduri dengan lebih banyak duri)
            obstacles.forEach(obs => {
                const centerX = obs.x + 10;
                const centerY = obs.y + 10;
                const radius = 10;

                // Lingkaran utama (abu-abu)
                ctx.fillStyle = 'gray';
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fill();

                // Duri (segitiga kecil di sekitar, lebih banyak)
                ctx.fillStyle = 'black';
                for (let i = 0; i < 12; i++) { // Tambah duri menjadi 12
                    const angle = (i * Math.PI) / 6;
                    const spikeX = centerX + Math.cos(angle) * (radius + 5);
                    const spikeY = centerY + Math.sin(angle) * (radius + 5);
                    ctx.beginPath();
                    ctx.moveTo(spikeX, spikeY);
                    ctx.lineTo(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius);
                    ctx.lineTo(centerX + Math.cos(angle + Math.PI / 12) * radius, centerY + Math.sin(angle + Math.PI / 12) * radius);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Draw snake body (lingkaran hijau)
            ctx.fillStyle = 'green';
            for (let i = 1; i < snake.length; i++) {
                ctx.beginPath();
                ctx.arc(snake[i].x + 10, snake[i].y + 10, 10, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Draw snake head (lingkaran hijau dengan mata dan mulut bertaring)
            const head = snake[0];
            ctx.fillStyle = 'green';
            ctx.beginPath();
            ctx.arc(head.x + 10, head.y + 10, 10, 0, 2 * Math.PI);
            ctx.fill();

            // Mata (dua lingkaran hitam kecil)
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(head.x + 6, head.y + 6, 2, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(head.x + 14, head.y + 6, 2, 0, 2 * Math.PI);
            ctx.fill();

            // Mulut bertaring (lengkung dengan gigi)
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(head.x + 10, head.y + 12, 6, 0, Math.PI);
            ctx.stroke();

            // Gigi (segitiga kecil)
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(head.x + 8, head.y + 12);
            ctx.lineTo(head.x + 10, head.y + 16);
            ctx.lineTo(head.x + 12, head.y + 12);
            ctx.closePath();
            ctx.fill();

            // Draw food (apel merah)
            food.forEach(f => {
                const appleX = f.x + 10;
                const appleY = f.y + 10;
                // Badan apel (lingkaran merah)
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(appleX, appleY, 10, 0, 2 * Math.PI);
                ctx.fill();

                // Tangkai (garis hijau)
                ctx.strokeStyle = 'green';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(appleX, appleY - 10);
                ctx.lineTo(appleX, appleY - 15);
                ctx.stroke();

                // Daun (segitiga hijau)
                ctx.fillStyle = 'green';
                ctx.beginPath();
                ctx.moveTo(appleX, appleY - 15);
                ctx.lineTo(appleX - 3, appleY - 12);
                ctx.lineTo(appleX + 3, appleY - 12);
                ctx.closePath();
                ctx.fill();
            });
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            bgMusic.pause();
            alert('Game Over! Skor: ' + score);
            menu.style.display = 'block';
            game.style.display = 'none';
        }

        // Kontrol keyboard (PC)
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'Shift') {
                clearInterval(gameLoop);
                speed = 50; // Kecepatan cepat 50ms
                gameLoop = setInterval(update, speed);
            } else {
                switch (e.key) {
                    case 'ArrowUp':
                        if (direction.y === 0) direction = {x: 0, y: -20};
                        break;
                    case 'ArrowDown':
                        if (direction.y === 0) direction = {x: 0, y: 20};
                        break;
                    case 'ArrowLeft':
                        if (direction.x === 0) direction = {x: -20, y: 0};
                        break;
                    case 'ArrowRight':
                        if (direction.x === 0) direction = {x: 20, y: 0};
                        break;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Shift') {
                clearInterval(gameLoop);
                speed = 125; // Kembali ke kecepatan normal 125ms
                gameLoop = setInterval(update, speed);
            }
        });

        // Kontrol tombol (HP)
        document.getElementById('up-hp').addEventListener('click', () => {
            if (gameRunning && direction.y === 0) direction = {x: 0, y: -20};
        });
        document.getElementById('down-hp').addEventListener('click', () => {
            if (gameRunning && direction.y === 0) direction = {x: 0, y: 20};
        });
        document.getElementById('left-hp').addEventListener('click', () => {
            if (gameRunning && direction.x === 0) direction = {x: -20, y: 0};
        });
        document.getElementById('right-hp').addEventListener('click', () => {
            if (gameRunning && direction.x === 0) direction = {x: 20, y: 0};
        });

        // Kontrol tombol (PC) - sama seperti HP
        document.getElementById('up-pc').addEventListener('click', () => {
            if (gameRunning && direction.y === 0) direction = {x: 0, y: -20};
        });
        document.getElementById('down-pc').addEventListener('click', () => {
            if (gameRunning && direction.y === 0) direction = {x: 0, y: 20};
        });
        document.getElementById('left-pc').addEventListener('click', () => {
            if (gameRunning && direction.x === 0) direction = {x: -20, y: 0};
        });
        document.getElementById('right-pc').addEventListener('click', () => {
            if (gameRunning && direction.x === 0) direction = {x: 20, y: 0};
        });
    </script>
</body>
</html>
